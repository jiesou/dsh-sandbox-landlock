# The grant tool, the approval card and the tolerant argument handling ride the
# shared sandbox-policy seam and work with any backend. Only the Landlock runner
# is Linux-specific, so the stock providers stay everywhere else.
- id: sandbox
  disabled: !!js process.platform === 'linux'
- id: fs-sandbox
  disabled: !!js process.platform === 'linux'
- insert:
    - id: sandbox-landlock
      name: dsh-sandbox-landlock
      config:
        # 串口等设备节点：通配符在每条命令 confine 时展开（Landlock 规则绑 inode，
        # 拔插后下一条命令自动重新授权；设备缺席自动剔除，不会触发 launcher exit 125）
        devicePaths:
          - /dev/ttyUSB*
          - /dev/ttyACM*
          - /dev/hidraw*
          # pty：没有它，沙箱内任何要开伪终端的程序（tmux、script、expect、
          # pty.fork）都会在 openpty 处吃 EACCES，看着像“禁止创建进程”。
          # /dev/ptmx 本身 0666；/dev/pts/* 归当前会话用户。
          - /dev/ptmx
          - /dev/pts/*
          # GPU 加速：VA-API / EGL / Vulkan 只需 render node（udev 建为 0666，全球可读写）。
          # card* 是 DRM master、能接管显示，不在此列。
          - /dev/dri/renderD*
